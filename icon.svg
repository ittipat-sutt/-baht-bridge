<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#102d5c"/>
      <stop offset="100%" stop-color="#2389ec"/>
    </linearGradient>
    <linearGradient id="symbolGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eaf5ff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0e2344" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- App Icon Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" filter="url(#shadow)"/>
  
  <!-- Subtle Inner Ring -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.15"/>
  
  <!-- Baht Currency Symbol -->
  <g fill="url(#symbolGrad)" transform="matrix(1 0 0 1 0 0)">
    <!-- Vertical Spine -->
    <rect x="238" y="90" width="36" height="332" rx="18"/>
    
    <!-- Left Stem -->
    <path d="M 170 140 H 290 C 330 140 355 165 355 200 C 355 230 335 248 305 254 C 342 260 365 285 365 320 C 365 360 335 385 285 385 H 170 C 153 385 140 372 140 355 V 170 C 140 153 153 140 170 140 Z M 205 180 V 238 H 280 C 298 238 312 225 312 209 C 312 193 298 180 280 180 Z M 205 278 V 345 H 285 C 305 345 320 330 320 312 C 320 293 305 278 285 278 Z" fill-rule="evenodd"/>
  </g>
</svg>

